# Always-on backend on an Oracle Cloud Always Free VM (or any Linux box).
# Caddy terminates TLS (automatic Let's Encrypt) and proxies REST + WebSocket.
#
#   DOMAIN=<ip-with-dashes>.sslip.io ALLOWED_ORIGINS=https://your-app.vercel.app docker compose up -d --build
services:
  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      LOG_OUTPUT: both # rotating files in ./logs + `docker compose logs`
      LOG_MAX_MB: "50"
      LOG_MAX_DAYS: "14"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
    volumes:
      - ./logs:/logs # must be writable by uid 65532 (distroless nonroot)
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  caddy_data:
