# Render Blueprint for the backend (free web service).
# Dashboard -> New -> Blueprint -> pick this repo. The frontend goes to Vercel.
services:
  - type: web
    name: cryptofeed-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # closest Render region to India; lower RTT => better tier
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS # e.g. https://your-app.vercel.app
        sync: false
      - key: RANDOM_SEED
        value: "42"
      - key: LOG_OUTPUT # Render's disk is ephemeral; stdout goes to the Logs tab
        value: stdout
